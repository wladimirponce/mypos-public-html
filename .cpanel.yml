---
deployment:
  tasks:
    - export DEPLOYPATH=/home/zylajdcb/public_html
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/rm -rf $DEPLOYPATH/api/graph $DEPLOYPATH/api/tools $DEPLOYPATH/api/persistence $DEPLOYPATH/api/__pycache__
    - /bin/rm -f $DEPLOYPATH/api/config.py $DEPLOYPATH/api/main.py $DEPLOYPATH/api/passenger_wsgi.py $DEPLOYPATH/api/requirements.txt $DEPLOYPATH/api/test_local.py
    - /bin/cp -R assets $DEPLOYPATH/
    - /bin/cp -R img $DEPLOYPATH/
    - /bin/cp -R admin $DEPLOYPATH/
    - /bin/cp -R api $DEPLOYPATH/
    - /bin/cp -R agent $DEPLOYPATH/
    - /bin/cp -R whatsapp $DEPLOYPATH/
    - /bin/cp -R descargas $DEPLOYPATH/
    - /bin/cp .htaccess $DEPLOYPATH/.htaccess
    - /bin/cp icons.svg $DEPLOYPATH/icons.svg
    - /bin/cp index.html $DEPLOYPATH/index.html
    - /bin/cp manifest.webmanifest $DEPLOYPATH/manifest.webmanifest
    - /bin/cp sw.js $DEPLOYPATH/sw.js
    - /bin/cp vite.svg $DEPLOYPATH/vite.svg
    - /bin/cp robots.txt $DEPLOYPATH/robots.txt
    - /bin/cp sitemap.xml $DEPLOYPATH/sitemap.xml